# Trickpad

# Lines without # are active. Save, then choose Reload Settings in the menu bar.
# Choose Manage with Agent for help, or see the full reference:
# https://thirdwind.fyi/trickpad/

[GENERAL]

config-version = 3
dominant-hand = "right"
haptic-feedback = true
menu-bar-icon = "trickpad" # Try an SF Symbol such as "sf:hand.tap.fill".
experimental-mouse-click-gestures = false

[MOUSE]

hold-left-tap-right = "return"
hold-right-tap-left = "escape"
two-finger-tap = { action = "middle-click", defer = true }


# Optional bindings. Remove # to enable one.

# three-finger-tap = "ctrl+cmd+a"
# two-finger-tap = { action = "middle-click", defer = true }
# three-finger-tap = "script:~/.config/trickpad/scripts/capture-selection"
# front-right-tap = "url:raycast://extensions/raycast/raycast-ai/ai-chat"
# two-finger-click = "right-ctrl+space"  # Experimental; replaces the normal click when recognized.

[TRACKPAD]

hold-left-tap-right = "return"
hold-right-tap-left = "escape"


# Optional bindings. Remove # to enable one.

# three-finger-tap = "cmd+shift+a"
# four-finger-tap = "url:things:///add?title={{clipboard|urlencode}}"
# three-finger-click = { action = "escape", haptic = true }
