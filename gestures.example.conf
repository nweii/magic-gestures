# MagicGestures configuration
#
# Lines are `setting = value`. Anything after # is a comment. Blank lines and
# unknown settings are ignored, so an older config keeps working against a
# newer build.
#
# Booleans accept true/false, yes/no, on/off, and 1/0.
#
# [section] headers set which device the lines under them apply to. A setting
# can also name its device inline, as `mouse.two-finger-tap`, which works
# anywhere in the file and does not care what section it lands in. Write it
# that way when appending a line programmatically, so it cannot be misfiled.
#
# Copy this to ~/.config/magic-gestures/gestures.conf, or keep a `config` file beside
# this one in the checkout, which takes priority.


# ── Gestures ────────────────────────────────────────────────────────────────
#
# Each gesture takes either a keystroke or a built-in action.
#
# WRITING A KEYSTROKE
#
# Modifiers first, then one key. Every spelling below means the same thing, so
# write whichever you would say out loud. Case does not matter.
#
#   Command    cmd    command    ⌘
#   Control    ctrl   control    ⌃
#   Option     opt    option     alt    ⌥
#   Shift      shift             ⇧
#
# Join them with + or - or a space. These four lines are identical:
#
#   cmd+shift+a
#   command-shift-a
#   ⌘⇧A
#   Cmd Shift A
#
# Quotes are optional and stripped if present. Spaces around = are ignored.
#
# KEY NAMES
#
#   letters and digits    a  z  0  9
#   return escape tab space delete forward-delete
#   up down left right   home end page-up page-down
#   f1 through f12
#
#   Aliases: enter = return, esc = escape, backspace = delete,
#            del = delete, spacebar = space
#
# BUILT-IN ACTIONS
#
#   middle-click       mission-control    move-resize
#   next-tab           previous-tab       new-tab
#   close-tab          reopen-tab
#
# Open `Current Gestures` in the menu bar to see what is live right now.

# Hold one finger still, tap beside it with another. A resting hand cannot make
# this shape, so it will not fire by accident.

[mouse]
hold-middle-tap-index = return
# hold-index-tap-middle = cmd+shift+a
# two-finger-tap = middle-click

[trackpad]
# Same idea, named by where the tap lands rather than by finger.
hold-tap-left = return
# hold-tap-right = escape
# three-finger-tap = middle-click
# three-finger-swipe-up = ctrl+up

# Motions macOS already claims are listed in GESTURES.md. Binding one of those
# means both fire.


# ── Behavior ────────────────────────────────────────────────────────────────
#
# These belong to no device, so they sit outside any section.

[general]

# Show the menu bar icon.
show-menu-bar-icon = true

# Start automatically when you log in.
open-at-login = true

# How long a tap may last, in seconds. Raise it if fix-taps feel hard to land.
tap-speed = 0.25

# Which devices to watch.
enable-mouse = true
enable-trackpad = true

# Log every recognized gesture and dispatched key to Console.
verbose-logging = false
