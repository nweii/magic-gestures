<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1080" viewBox="0 0 660 540">
  <rect width="660" height="540" fill="#f7f8f7"/>
  <text x="330" y="58" fill="#20262a" font-family="Dinish Expanded" font-size="22" font-weight="700" text-anchor="middle">Install Trickpad</text>
  <path d="M260 150 H400" fill="none" stroke="#2c8aa8" stroke-width="3" stroke-linecap="round"/>
  <path d="M388 138 L401 150 L388 162" fill="none" stroke="#2c8aa8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Dinish Expanded" font-size="13.5">
    <text x="118" y="268" fill="#2c8aa8" font-weight="700">1</text>
    <text x="141" y="268" fill="#20262a" font-weight="400">Drag Trickpad to Applications.</text>
    <text x="118" y="294" fill="#2c8aa8" font-weight="700">2</text>
    <text x="141" y="294" fill="#20262a" font-weight="400">Open it. macOS shows a warning: choose Done, not Move to Trash.</text>
    <text x="118" y="320" fill="#2c8aa8" font-weight="700">3</text>
    <text x="141" y="320" fill="#20262a" font-weight="400">System Settings → Privacy &amp; Security → Open Anyway (scroll down).</text>
  </g>
</svg>
